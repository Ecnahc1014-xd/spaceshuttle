<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>高光时刻 · 关卡结算（科幻版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
<style>
  /* ==========================================================
     色板与游戏一致：石墨底 / 银白 / 琥珀金（禁止大面积青绿）
     等级阶梯：常规银 → 稀有蓝 → 史诗紫 → 传说金
     ========================================================== */
  :root{
    --ink:#0A0C12;
    --tier:#C9D2E0;
    --tier-bright:#F4F7FF;
    --tier-deep:#5A6474;
    --bg-hot:#141B26;
    --grid:rgba(255,255,255,.075);
    --sw:5px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:#04060a; }
  body{
    font-family:"Rajdhani","Orbitron",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased; user-select:none;
  }

  #stage{ position:fixed; inset:0; overflow:hidden; }
  #scene{ position:absolute; inset:0; display:block; }

  /* ---------- 深空底 / 网格 / 扫描线 ---------- */
  #bg{
    position:absolute; inset:0; z-index:0;
    background:
      radial-gradient(70% 55% at 50% 54%, var(--bg-hot) 0%, transparent 72%),
      linear-gradient(180deg, #070a10 0%, #04060a 60%, #020306 100%);
    transition:background .8s ease;
  }
  #grid{
    position:absolute; inset:-10%; z-index:0; opacity:.9;
    background-image:
      repeating-linear-gradient(0deg, var(--grid) 0 1px, transparent 1px 48px),
      repeating-linear-gradient(90deg, var(--grid) 0 1px, transparent 1px 48px);
    -webkit-mask-image:radial-gradient(60% 55% at 50% 52%, #000 0%, transparent 78%);
            mask-image:radial-gradient(60% 55% at 50% 52%, #000 0%, transparent 78%);
  }
  #rays{
    position:absolute; z-index:1; left:50%; top:54%;
    width:180vmax; height:180vmax; margin:-90vmax 0 0 -90vmax;
    background:repeating-conic-gradient(from 0deg,
      color-mix(in srgb, var(--tier) 22%, transparent) 0deg .55deg,
      transparent .55deg 7deg);
    opacity:.20; animation:spin 60s linear infinite;
    -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 4%, rgba(0,0,0,.4) 26%, transparent 52%);
            mask-image:radial-gradient(circle at 50% 50%, #000 4%, rgba(0,0,0,.4) 26%, transparent 52%);
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #glow{
    position:absolute; z-index:1; left:50%; top:55%;
    width:56vmin; height:56vmin; margin:-28vmin 0 0 -28vmin; border-radius:50%;
    background:radial-gradient(circle, color-mix(in srgb, var(--tier-bright) 46%, transparent) 0%, transparent 62%);
    opacity:0; mix-blend-mode:screen; pointer-events:none;
  }
  #flash{
    position:absolute; inset:0; z-index:3; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 50% 54%, #fff 0%, color-mix(in srgb, var(--tier-bright) 55%, #fff) 30%, transparent 66%);
    mix-blend-mode:screen;
  }
  #flash.pop{ animation:flashPop .45s ease-out; }
  @keyframes flashPop{ 0%{opacity:0} 10%{opacity:.6} 100%{opacity:0} }
  #scan{
    position:absolute; inset:0; z-index:2; pointer-events:none; opacity:.5;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,.045) 0 1px, transparent 1px 4px);
    -webkit-mask-image:radial-gradient(70% 60% at 50% 52%, #000 20%, transparent 85%);
            mask-image:radial-gradient(70% 60% at 50% 52%, #000 20%, transparent 85%);
  }
  #vignette{
    position:absolute; inset:0; z-index:2; pointer-events:none;
    background:radial-gradient(128% 96% at 50% 50%, transparent 44%, rgba(2,3,6,.72) 100%);
  }

  /* ---------- HUD ---------- */
  #hud{ position:absolute; inset:0; z-index:6; pointer-events:none; }
  .bracket{ position:absolute; width:52px; height:52px; opacity:.5; }
  .bracket::before, .bracket::after{ content:''; position:absolute; background:var(--tier); }
  .bracket::before{ width:100%; height:2px; }
  .bracket::after{ width:2px; height:100%; }
  .bracket.tl{ left:2.4vw; top:2.6vh; }
  .bracket.tr{ right:2.4vw; top:2.6vh; transform:scaleX(-1); }
  .bracket.bl{ left:2.4vw; bottom:2.6vh; transform:scaleY(-1); }
  .bracket.br{ right:2.4vw; bottom:2.6vh; transform:scale(-1,-1); }

  #top{
    position:absolute; left:0; right:0; top:2.4vh;
    display:flex; flex-direction:column; align-items:center; gap:1.0vh;
  }
  #chip{
    position:relative; display:inline-flex; align-items:center; gap:10px;
    padding:7px 18px 8px;
    background:linear-gradient(180deg, rgba(28,33,42,.95), rgba(12,15,21,.95));
    border:2px solid color-mix(in srgb, var(--tier) 70%, #000);
    border-radius:3px;
    font-family:"Orbitron",sans-serif; font-weight:600;
    font-size:clamp(10px,1.15vw,14px); letter-spacing:.24em; color:var(--tier-bright);
    box-shadow:0 0 22px color-mix(in srgb, var(--tier) 30%, transparent), inset 0 1px 0 rgba(255,255,255,.14);
    animation:chipIn .5s cubic-bezier(.2,1.6,.4,1) .1s both;
  }
  #chip::before{
    content:''; position:absolute; left:-2px; top:-2px; bottom:-2px; width:3px;
    background:var(--tier); box-shadow:0 0 10px var(--tier);
  }
  #chip .dot{ width:7px; height:7px; background:var(--tier); box-shadow:0 0 10px var(--tier); }
  @keyframes chipIn{ 0%{ transform:translateY(-160%); opacity:0 } 100%{ transform:none; opacity:1 } }
  #chip.bounce{ animation:chipPop .45s cubic-bezier(.2,1.7,.4,1); }
  @keyframes chipPop{ 0%{transform:scale(1)} 45%{transform:scale(1.12)} 100%{transform:scale(1)} }

  /* 标题：粗黑 + 斜切 + 硬描边 + 双层硬投影，逐字砸入 */
  #title{
    margin:0; display:flex; justify-content:center; align-items:flex-end; gap:.015em;
    font-size:clamp(46px,7.6vw,120px); line-height:.94;
    font-weight:900; letter-spacing:-.02em;
    font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
    transform:skewX(-7deg);
  }
  #title .ch{
    display:block; position:relative; color:var(--tier);
    text-shadow:
      0 var(--sw) 0 var(--ink), 0 calc(var(--sw) * -1) 0 var(--ink),
      var(--sw) 0 0 var(--ink), calc(var(--sw) * -1) 0 0 var(--ink),
      var(--sw) var(--sw) 0 var(--ink), calc(var(--sw) * -1) var(--sw) 0 var(--ink),
      var(--sw) calc(var(--sw) * -1) 0 var(--ink), calc(var(--sw) * -1) calc(var(--sw) * -1) 0 var(--ink),
      calc(var(--sw) * 2) calc(var(--sw) * 2) 0 color-mix(in srgb, var(--tier) 55%, #000),
      calc(var(--sw) * 4) calc(var(--sw) * 4) 22px rgba(0,0,0,.62);
    opacity:0; will-change:transform;
  }
  #title .ch::after{
    content:attr(data-ch); position:absolute; left:0; top:0;
    color:rgba(255,255,255,.45); clip-path:inset(0 0 58% 0); pointer-events:none;
  }
  @keyframes slam{
    0%{ opacity:0; transform:translateY(-64vh) scale(2.6) rotate(-8deg); }
    48%{ opacity:1; transform:translateY(0) scale(.90) rotate(1.2deg); }
    62%{ transform:translateY(-3%) scale(1.07) translateX(-6px) rotate(-.6deg); }
    74%{ transform:translateY(0) scale(.99) translateX(4px); }
    86%{ transform:translateX(-2px) scale(1.01); }
    100%{ opacity:1; transform:none; }
  }

  /* 评级：六边形能量块 */
  #stars{ display:flex; gap:.9vw; margin-top:.5vh; }
  .star{ width:clamp(28px,3.5vw,50px); height:auto; opacity:0; }
  @keyframes hexPop{
    0%{ opacity:0; transform:scale(0) rotate(-40deg); }
    58%{ opacity:1; transform:scale(1.3) rotate(8deg); }
    100%{ opacity:1; transform:scale(1) rotate(0); }
  }
  .star.off{ opacity:.45; }

  #bottom{
    position:absolute; left:0; right:0; bottom:2.4vh;
    display:flex; flex-direction:column; align-items:center; gap:1.4vh;
  }
  #scoreRow{ display:flex; align-items:flex-end; gap:1.0vw; }
  #scoreLabel{
    font-family:"Orbitron",sans-serif; font-weight:600; letter-spacing:.28em;
    font-size:clamp(9px,1.05vw,12px); color:rgba(226,228,232,.55); margin-bottom:.8vh;
  }
  #score{
    font-family:"Orbitron",sans-serif; font-weight:800;
    font-size:clamp(26px,3.9vw,54px); line-height:1; color:#F2F6FF;
    text-shadow:
      0 3px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink),
      0 10px 22px rgba(0,0,0,.7),
      0 0 26px color-mix(in srgb, var(--tier) 45%, transparent);
  }
  #score .plus{ color:var(--tier); }

  #tiers{
    pointer-events:auto; display:flex; gap:8px; padding:6px 8px;
    background:rgba(10,13,19,.82);
    border:2px solid rgba(120,132,150,.35); border-radius:3px;
    backdrop-filter:blur(6px); box-shadow:0 0 24px rgba(0,0,0,.5);
  }
  #tiers button{
    pointer-events:auto; border:1px solid transparent; cursor:pointer;
    font-family:"Rajdhani",system-ui,sans-serif; font-weight:700;
    font-size:clamp(10px,1.1vw,13px); letter-spacing:.14em;
    padding:7px 15px 8px; border-radius:2px;
    color:rgba(226,228,232,.62); background:rgba(255,255,255,.05);
    transition:all .18s ease;
  }
  #tiers button:hover{ color:#fff; background:rgba(255,255,255,.12); }
  #tiers button.on{
    color:#0A0C12; background:var(--tier-bright); border-color:#fff;
    box-shadow:0 0 18px color-mix(in srgb, var(--tier) 70%, transparent), inset 0 0 0 1px rgba(0,0,0,.25);
  }

  #boot{
    position:absolute; inset:0; z-index:20; display:grid; place-items:center;
    background:#04060a; color:#7d8798; font-size:13px; letter-spacing:.22em;
    font-family:"Orbitron",sans-serif; transition:opacity .5s ease;
  }
  #boot.hide{ opacity:0; pointer-events:none; }
  #boot b{ color:#fff; }
</style>
<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="grid"></div>
  <canvas id="scene"></canvas>
  <div id="rays"></div>
  <div id="glow"></div>
  <div id="flash"></div>
  <div id="scan"></div>
  <div id="vignette"></div>

  <div id="hud">
    <div class="bracket tl"></div><div class="bracket tr"></div>
    <div class="bracket bl"></div><div class="bracket br"></div>

    <div id="top">
      <div id="chip"><span class="dot"></span><span id="chipText">SECTOR CLEARED</span></div>
      <h1 id="title"></h1>
      <div id="stars"></div>
    </div>

    <div id="bottom">
      <div id="scoreRow">
        <div id="scoreLabel">SALVAGE</div>
        <div id="score"><span class="plus">+</span><span id="scoreNum">0</span></div>
      </div>
      <div id="tiers"></div>
    </div>
  </div>

  <div id="boot">INITIALIZING COMBAT RECORD…</div>
</div>

<script type="module">
/* =========================================================================
   「高光时刻」关卡结算 · 科幻版 v1.0（按 design/高光时刻-结算动效-提示词.md 实现）
   主体：空投补给舱 Cargo Pod
     · 下箱体 + 四面围栏（顶部真开口）+ 单片装甲盖绕后缘铰链向上翻开
     · 3×3 / 2×3 装甲分块（真缝隙 + 凹槽条）、加强肋、螺栓、斜切护角、
       散热格栅、警示斜纹带、锁扣座、内腔能量接口环、悬浮推进环
     · 能量核心 + 三轴陀螺环 + 7 个悬浮碎片，开盖后升起并持续自转
   渲染：MeshToonMaterial（4 阶渐变）+ 三灯 + 法线/深度后处理描边
        （外轮廓 2.6px、交界 1.4px）+ 1.5x 超采样 + MSAA 4x
   ========================================================================= */

const boot = document.getElementById('boot');

let THREE, RoundedBoxGeometry = null;
try {
  THREE = await import('three');
  try {
    ({ RoundedBoxGeometry } = await import('three/addons/geometries/RoundedBoxGeometry.js'));
  } catch (e) {
    console.warn('[highlight] RoundedBoxGeometry 不可用，回退内置圆角盒', e);
  }
} catch (err) {
  boot.innerHTML = '<b>three.js 加载失败</b><br>请检查网络（cdn.jsdelivr.net）后刷新';
  throw err;
}

/* ------------------------------ 等级阶梯 ------------------------------ */
const TIERS = [
  { key:'common', en:'SECTOR CLEARED', name:'常规清场', stars:1, score:1280,
    color:'#C9D2E0', bright:'#F4F7FF', deep:'#5A6474', bgHot:'#141B26', ring:'#9AA6B8' },
  { key:'rare',   en:'RARE SALVAGE',   name:'稀有回收', stars:2, score:3640,
    color:'#5B93FF', bright:'#BBD4FF', deep:'#1E4C99', bgHot:'#0C1A33', ring:'#7FB0FF' },
  { key:'epic',   en:'EPIC SALVAGE',   name:'史诗回收', stars:3, score:8720,
    color:'#A26BFF', bright:'#DFC9FF', deep:'#4E2394', bgHot:'#170C2C', ring:'#C39CFF' },
  { key:'legend', en:'LEGENDARY DROP', name:'传说空投', stars:3, score:15840,
    color:'#F3A73E', bright:'#FFDCA4', deep:'#9A5F12', bgHot:'#2B1904', ring:'#FFC46B' },
];

/* ------------------------------ 渲染基础 ------------------------------ */
const stage  = document.getElementById('stage');
const canvas = document.getElementById('scene');

const renderer = new THREE.WebGLRenderer({ canvas, antialias:false, alpha:true, powerPreference:'high-performance' });
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;  // 末段自己编码 sRGB
renderer.toneMapping = THREE.NoToneMapping;
renderer.setClearColor(0x000000, 0);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 90);
camera.position.set(0.0, 2.72, 7.35);
camera.lookAt(0, 1.46, 0);

/* 4 阶卡通渐变（最高阶 232：不过曝，保留高光层次） */
function makeGradientMap(){
  const data = new Uint8Array([ 58,58,58,255, 108,108,108,255, 172,172,172,255, 232,232,232,255 ]);
  const t = new THREE.DataTexture(data, 4, 1, THREE.RGBAFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  t.needsUpdate = true;
  return t;
}
const GRAD = makeGradientMap();

/* 三灯：主光 / 天光 / 等级色轮廓光 */
const keyLight = new THREE.DirectionalLight(0xeaf3ff, 2.00);
keyLight.position.set(4.6, 7.2, 5.2);
scene.add(keyLight);

const skyLight = new THREE.HemisphereLight(0xbcd6ff, 0x0b1018, 1.05);
scene.add(skyLight);

const rimLight = new THREE.DirectionalLight(0xC9D2E0, 1.80);
rimLight.position.set(-5.2, 3.4, -7.4);
scene.add(rimLight);

const fillLight = new THREE.DirectionalLight(0xffffff, 0.42);
fillLight.position.set(-2.4, -1.4, 4.4);
scene.add(fillLight);

/* ------------------------------ 圆角盒 ------------------------------ */
function roundedBox(w, h, d, r){
  if (RoundedBoxGeometry) return new RoundedBoxGeometry(w, h, d, 4, r);
  const seg = 7;
  const g = new THREE.BoxGeometry(w, h, d, seg, seg, seg);
  const pos = g.attributes.position;
  const hw = Math.max(.001, w/2-r), hh = Math.max(.001, h/2-r), hd = Math.max(.001, d/2-r);
  const v = new THREE.Vector3(), q = new THREE.Vector3(), n = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++){
    v.fromBufferAttribute(pos, i);
    q.set(THREE.MathUtils.clamp(v.x,-hw,hw), THREE.MathUtils.clamp(v.y,-hh,hh), THREE.MathUtils.clamp(v.z,-hd,hd));
    n.copy(v).sub(q);
    if (n.lengthSq() > 1e-8){ n.normalize().multiplyScalar(r).add(q); pos.setXYZ(i, n.x, n.y, n.z); }
  }
  g.computeVertexNormals();
  return g;
}

/* ------------------------------ 材质 ------------------------------ */
const toon = (hex) => new THREE.MeshToonMaterial({ color:new THREE.Color(hex), gradientMap:GRAD });

const matHull      = toon('#262C36');   // 舱体结构（石墨）
const matHullDark  = toon('#151A22');   // 缝隙 / 内腔
const matPlate     = toon('#CCD6E4');   // 银白装甲
const matPlateMid  = toon('#7C879A');
const matPlateDark = toon('#5D6779');
const matRib       = toon('#CBD5E4');   // 加强肋
const matWarning   = toon('#F3A73E');   // 警示黄（与稀有金同源）
const matWarningK  = toon('#171B23');
const matBolt      = toon('#3C4553');
const matTier      = toon('#C9D2E0');   // 等级色金属件
const matTierDeep  = toon('#5A6474');

// 不受光的能量件（等级色）
const matEnergy = new THREE.MeshBasicMaterial({ color:0xF4F7FF });
const matCore   = new THREE.MeshBasicMaterial({ color:0xF4F7FF });
const matRing   = new THREE.MeshBasicMaterial({ color:0xE8F0FF, transparent:true, opacity:.85 });
const matLining = new THREE.MeshBasicMaterial({ color:new THREE.Color('#0E1319') }); // 盖内侧深色底

/* ------------------------------ 补给舱 ------------------------------ */
const W = 2.66, H = 1.12, D = 1.78;
const PLATE_T = 0.10;
const GAP = 0.062;
const LOWER = 0.84;              // 下箱体高度（以上是围栏 + 真开口）

const pod = new THREE.Group();
pod.scale.setScalar(0.82);
scene.add(pod);

const body = new THREE.Group();
pod.add(body);

/* --- 下箱体 + 围栏（顶部开口）+ 内腔 --- */
{
  const hull = new THREE.Mesh(roundedBox(W, LOWER, D, 0.08), matHull);
  hull.position.y = LOWER / 2;
  body.add(hull);

  const railT = 0.14;
  for (const zs of [1, -1]){
    const bar = new THREE.Mesh(roundedBox(W, H - LOWER, railT, 0.03), matHull);
    bar.position.set(0, LOWER + (H - LOWER) / 2, zs * (D / 2 - railT / 2));
    body.add(bar);
  }
  for (const xs of [1, -1]){
    const bar = new THREE.Mesh(roundedBox(railT, H - LOWER, D - railT * 2, 0.03), matHull);
    bar.position.set(xs * (W / 2 - railT / 2), LOWER + (H - LOWER) / 2, 0);
    body.add(bar);
  }

  // 开口内侧：深色内底，盖住箱体顶面（否则露出浅灰大平面）
  const innerFloor = new THREE.Mesh(roundedBox(W - 0.26, 0.035, D - 0.26, 0.02),
    new THREE.MeshBasicMaterial({ color:new THREE.Color('#0B0F15') }));
  innerFloor.position.y = LOWER + 0.02;
  body.add(innerFloor);

  // 内腔四壁
  const wallT = 0.06;
  for (const zs of [1, -1]){
    const w = new THREE.Mesh(roundedBox(W - 0.30, 0.42, wallT, 0.02), matHullDark);
    w.position.set(0, LOWER + 0.19, zs * (D / 2 - railT - wallT / 2));
    body.add(w);
  }
  for (const xs of [1, -1]){
    const w = new THREE.Mesh(roundedBox(wallT, 0.42, D - 0.30, 0.02), matHullDark);
    w.position.set(xs * (W / 2 - railT - wallT / 2), LOWER + 0.19, 0);
    body.add(w);
  }

  // 内腔底部能量接口
  const socket = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.06, 24), matHullDark);
  socket.position.y = LOWER - 0.01;
  body.add(socket);
  const socketRing = new THREE.Mesh(new THREE.TorusGeometry(0.36, 0.026, 8, 30), matTierDeep);
  socketRing.rotation.x = Math.PI / 2;
  socketRing.position.y = LOWER + 0.02;
  body.add(socketRing);
}

/* --- 装甲分块：正面 3×3、左右 2×3（真缝隙 + 凹槽条） --- */
{
  const rows = 3, padX = 0.30;
  const cellH = (LOWER - 0.16 - GAP * (rows - 1)) / rows;
  const colsF = 3;
  const cellW = (W - padX * 2 - GAP * (colsF - 1)) / colsF;

  for (const zs of [1, -1]){
    for (let r = 0; r < rows; r++){
      for (let c = 0; c < colsF; c++){
        const mat = (r === rows - 1 ? matPlateDark : (c === 1 ? matPlateMid : matPlate));
        const plate = new THREE.Mesh(roundedBox(cellW, cellH, PLATE_T, 0.03), mat);
        plate.position.set(
          -W / 2 + padX + cellW / 2 + c * (cellW + GAP),
          0.10 + cellH / 2 + r * (cellH + GAP),
          zs * (D / 2 - PLATE_T / 2)
        );
        body.add(plate);
        const slot = new THREE.Mesh(roundedBox(cellW * 0.5, 0.032, 0.02, 0.01), matHullDark);
        slot.position.set(plate.position.x, plate.position.y + cellH * 0.24, zs * (D / 2 - PLATE_T * 0.55));
        body.add(slot);
      }
    }
  }

  const colsS = 2;
  const cellD = (D - 0.34 - GAP) / colsS;
  for (const xs of [1, -1]){
    for (let r = 0; r < rows; r++){
      for (let c = 0; c < colsS; c++){

/* =========================================================================
   描边后处理：法线图 + 深度图
   ========================================================================= */
const RT_BASE = { minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter, depthBuffer:true };
let colorRT, normalRT, depthRT;
let dispW = 2, dispH = 2;
const SS = 1.5;
const MAX_PIXELS = 3.2e6;

const normalMat = new THREE.ShaderMaterial({
  vertexShader: `
    varying vec3 vN;
    void main(){ vN = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    varying vec3 vN;
    void main(){ gl_FragColor = vec4(normalize(vN) * 0.5 + 0.5, 1.0); }`
});

const depthMat = new THREE.ShaderMaterial({
  uniforms:{ uFar:{ value:90 } },
  vertexShader: `
    varying float vD;
    void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); vD = -mv.z;
      gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `
    uniform float uFar; varying float vD;
    vec4 pack(float v){
      vec4 e = vec4(1.0, 255.0, 65025.0, 16581375.0) * v;
      e = fract(e);
      e -= e.yzww * vec4(1.0/255.0, 1.0/255.0, 1.0/255.0, 0.0);
      return e;
    }
    void main(){ gl_FragColor = pack(clamp(vD / uFar, 0.0, 1.0)); }`
});

const postMat = new THREE.ShaderMaterial({
  uniforms:{
    tColor:{ value:null }, tNormal:{ value:null }, tDepth:{ value:null },
    uRes:{ value:new THREE.Vector2(2,2) }, uFar:{ value:90 },
    uEdge:{ value:new THREE.Color('#0A0C12') },
  },
  vertexShader: `
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    precision highp float;
    uniform sampler2D tColor, tNormal, tDepth;
    uniform vec2 uRes; uniform float uFar; uniform vec3 uEdge;
    varying vec2 vUv;

    float unpackD(vec4 c){ return dot(c, vec4(1.0, 1.0/255.0, 1.0/65025.0, 1.0/16581375.0)); }
    float linD(vec2 uv){ return unpackD(texture2D(tDepth, uv)) * uFar; }
    vec3 nrm(vec2 uv){ return texture2D(tNormal, uv).xyz * 2.0 - 1.0; }
    float mk(vec2 uv){ return smoothstep(0.30, 0.52, texture2D(tColor, uv).a); }
    vec3 toSRGB(vec3 c){
      return mix(1.055 * pow(max(c, vec3(0.0)), vec3(1.0/2.4)) - 0.055, c * 12.92, step(c, vec3(0.0031308)));
    }

    void main(){
      vec2 px = 1.0 / uRes;
      vec4 base = texture2D(tColor, vUv);
      float m = mk(vUv);

      /* 外轮廓：2.6px 环采样（粗细恒定） */
      float sil = 0.0;
      for (int i = 0; i < 8; i++){
        float a = float(i) * 0.7853982;
        sil = max(sil, 1.0 - mk(vUv + vec2(cos(a), sin(a)) * px * 2.6));
      }
      sil *= m;

      /* 零件交界：1.4px，法线主导，深度仅 18% 辅助（阈值放宽，斜面不出碎纹） */
      vec3 n0 = nrm(vUv);
      float d0 = linD(vUv);
      float crease = 0.0;
      for (int i = 0; i < 4; i++){
        float a = float(i) * 1.5707963 + 0.7853982;
        vec2 off = vec2(cos(a), sin(a)) * px * 1.4;
        float ms = mk(vUv + off);
        float nd = 1.0 - dot(n0, nrm(vUv + off));
        float dd = abs(linD(vUv + off) - d0) / max(d0, 0.001);
        float nE = smoothstep(0.20, 0.52, nd);
        float dE = smoothstep(0.10, 0.22, dd) * 0.18;
        crease = max(crease, max(nE, dE) * ms);
      }
      crease *= m;

      float edge = clamp(max(sil, crease * 0.96), 0.0, 1.0);
      vec3 col = mix(base.rgb, uEdge, edge);
      gl_FragColor = vec4(toSRGB(col), base.a);
    }`,
  transparent:true, depthTest:false, depthWrite:false
});

function buildTargets(){
  const scale = Math.min(1, Math.sqrt(MAX_PIXELS / (dispW * SS * dispH * SS)));
  const w = Math.max(2, Math.round(dispW * SS * scale));
  const h = Math.max(2, Math.round(dispH * SS * scale));
  [colorRT, normalRT, depthRT].forEach(rt => rt && rt.dispose());
  colorRT  = new THREE.WebGLRenderTarget(w, h, { ...RT_BASE, samples:4, type:THREE.UnsignedByteType });
  normalRT = new THREE.WebGLRenderTarget(w, h, { ...RT_BASE, samples:4, type:THREE.UnsignedByteType });
  depthRT  = new THREE.WebGLRenderTarget(w, h, {
    minFilter:THREE.NearestFilter, magFilter:THREE.NearestFilter,
    depthBuffer:true, samples:0, type:THREE.UnsignedByteType
  });
  depthMat.uniforms.uFar.value = camera.far;
  postMat.uniforms.uFar.value = camera.far;
  postMat.uniforms.uRes.value.set(dispW, dispH);
}

function resize(){
  const cw = stage.clientWidth, ch = stage.clientHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  dispW = Math.max(2, Math.round(cw * dpr));
  dispH = Math.max(2, Math.round(ch * dpr));
  renderer.setPixelRatio(1);
  renderer.setSize(dispW, dispH, false);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  camera.aspect = cw / ch;
  camera.updateProjectionMatrix();
  buildTargets();
}
window.addEventListener('resize', resize);

function applyTier(i, opts = {}){
  const t = TIERS[i];

  root.setProperty('--tier-bright', t.bright);

  matEnergy.color.set(t.bright);
  matCore.color.set(t.color);
  matRing.color.set(t.ring);
  beam.material.color.set(t.bright);
  sparkMat.color.set(t.bright);
  rimLight.color.set(t.color).lerp(new THREE.Color('#ffffff'), 0.22);
  rimLight.intensity = 1.70 + i * 0.34;
  keyLight.intensity = 1.92 + i * 0.12;
  skyLight.intensity = 1.00 + i * 0.10;
  matWarning.color.set('#F3A73E').lerp(new THREE.Color(t.color), i === 3 ? 0 : 0.18);

  glowEl.style.background =
    `radial-gradient(circle, color-mix(in srgb, ${t.bright} 46%, transparent) 0%, transparent 62%)`;

  /* 评级六边形 */
  starsEl.innerHTML = '';
  for (let s = 0; s < 3; s++){
    const wrap = document.createElement('div');
    wrap.innerHTML = hexSVG(s < t.stars ? t.color : '#2A303C', s < t.stars ? t.bright : '#39404E');
    const svg = wrap.firstElementChild;
    if (s >= t.stars) svg.classList.add('off');
    svg.style.animation = `hexPop .55s cubic-bezier(.2,1.7,.4,1) ${0.28 + s * 0.11}s forwards`;
    starsEl.appendChild(svg);
  }

  chipText.textContent = t.en;
  chip.classList.remove('bounce');
  void chip.offsetWidth;
  chip.classList.add('bounce');
  scoreTarget = t.score;

  /* 标题逐字砸入（每档重播） */
  titleChars.forEach((el, k) => {
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = `slam .78s cubic-bezier(.16,1.02,.3,1) ${0.05 + k * 0.08}s forwards`;
  });

  [...tiersEl.children].forEach((b, k) => b.classList.toggle('on', k === i));
  lastSwitch = performance.now();
  if (opts.restart !== false) showStart = performance.now();
}

let lastBurstCycle = -1;
let frozenShow = null;        // 非 null 时把循环定格在该秒数（验收/截图用）

const clamp01 = x => Math.min(1, Math.max(0, x));
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

/* ------------------------------ 主循环 ------------------------------ */
let elapsed = 0;
let lastNow = performance.now();

function tick(){
  const now = performance.now();
  const rdt = Math.min((now - lastNow) / 1000, 0.25);   // 真时间，低帧率也不漂移
  lastNow = now;
  elapsed += rdt;
  const dt = Math.min(rdt, 1 / 30);

  const showT = (frozenShow !== null) ? frozenShow : ((now - showStart) / 1000) % CYCLE;

  /* 待机：缓慢左右转（看得到侧面与厚度）+ 悬浮升降 */
  pod.rotation.y = Math.sin(elapsed * 0.50) * 0.40;
  pod.rotation.x = Math.sin(elapsed * 0.37) * 0.02;
  const bob = Math.sin(elapsed * 1.05) * 0.06;
  pod.position.y = bob;

  const k = (bob + 0.06) / 0.12;
  shadow.scale.setScalar(1 - k * 0.14);
  shadow.material.opacity = 0.44 - k * 0.18;

  /* 舱盖 / 核心时序 */
  const openT  = seg(showT, 0.45, 1.30);
  const closeT = seg(showT, 5.55, 6.35);
  const openA = easeInOut(openT) - easeInOut(closeT);

  lidL.rotation.z =  openA * 1.56;
  lidR.rotation.z = -openA * 1.56;

  const riseT = clamp01(seg(showT, 0.95, 1.75) - seg(showT, 5.05, 5.55));
  const rise = easeOut(riseT);
  coreRig.visible = rise > 0.002;
  coreRig.position.y = H + 0.22 + rise * 0.52;
  coreRig.scale.setScalar(0.40 + 0.60 * rise);

  core.scale.setScalar(1 + 0.05 * Math.sin(elapsed * 4.2));
  core.rotation.y += dt * 0.9;
  core.rotation.x += dt * 0.42;
  coreShell.rotation.y -= dt * 0.55;
  coreShell.rotation.z += dt * 0.30;
  gyroA.rotation.x += dt * 1.60;
  gyroA.rotation.y += dt * 0.70;
  gyroB.rotation.y += dt * 1.25;
  gyroB.rotation.z += dt * 0.55;
  gyroC.rotation.x -= dt * 1.90;
  gyroC.rotation.z += dt * 0.80;

  shards.forEach((m, i) => {
    const a = elapsed * 0.55 + (i / shards.length) * Math.PI * 2;
    const r = 0.92 + Math.sin(elapsed * 0.9 + i) * 0.06;
    m.position.set(Math.cos(a) * r, H - 0.12 + Math.sin(elapsed * 1.3 + i * 1.7) * 0.10, Math.sin(a) * r * 0.66);
    m.rotation.y += dt * 1.4;
    m.rotation.x += dt * 0.7;
  });

  /* 光柱 / 光晕 / 底部辉光 */
  const beamT = clamp01(openT - closeT * 0.9);
  beam.material.opacity = beamT * (0.13 + tierIndex * 0.032) * (0.84 + 0.16 * Math.sin(elapsed * 3.6));
  beam.visible = beam.material.opacity > 0.004;
  beam.rotation.y = elapsed * 0.45;
  beam.scale.setScalar(1 + 0.05 * Math.sin(elapsed * 2.2));
  glowEl.style.opacity = String(beamT * (0.26 + 0.08 * Math.sin(elapsed * 2.8)));
  underGlow.material.opacity = 0.10 + 0.22 * beamT + 0.04 * Math.sin(elapsed * 3.1);

  /* 每轮开舱只喷一次火花 */
  const cycleId = Math.floor((now - showStart) / (CYCLE * 1000));
  if (openT > 0.05 && openT < 0.6 && cycleId !== lastBurstCycle){
    burstSparks(TIERS[tierIndex].bright);
    lastBurstCycle = cycleId;
    flashEl.classList.remove('pop');
    void flashEl.offsetWidth;
    flashEl.classList.add('pop');
  }
  if (sparks.visible){
    let alive = 0;
    for (let i = 0; i < SPARK_N; i++){
      if (sLife[i] <= 0) continue;
      sLife[i] -= dt; alive++;
      sPos[i*3]   += sVel[i*3] * dt;
      sPos[i*3+1] += sVel[i*3+1] * dt;
      sPos[i*3+2] += sVel[i*3+2] * dt;
      sVel[i*3+1] -= 4.4 * dt;
    }
    sparkGeo.attributes.position.needsUpdate = true;
    sparkMat.opacity = Math.max(0, sparkMat.opacity - dt * 0.55);
    if (alive === 0 || sparkMat.opacity <= 0.01) sparks.visible = false;
  }

  /* 分数滚动 */
  if (Math.abs(scoreShown - scoreTarget) > 0.5){
    scoreShown += (scoreTarget - scoreShown) * Math.min(1, dt * 7);
  } else scoreShown = scoreTarget;
  scoreNum.textContent = Math.round(scoreShown).toLocaleString('en-US');

  if (autoLoop && now - lastSwitch > 7600) applyTier((tierIndex + 1) % TIERS.length);

  render();
  requestAnimationFrame(tick);
}

/* ------------------------------ 三遍渲染 + 合成 ------------------------------ */
const hidden = [sparks, beam, shadow, underGlow];

function render(){
  scene.overrideMaterial = null;
  renderer.setRenderTarget(colorRT);
  renderer.setClearColor(0x000000, 0);
  renderer.clear();
  renderer.render(scene, camera);

  const vis = hidden.map(o => o.visible);
  hidden.forEach(o => o.visible = false);

  scene.overrideMaterial = normalMat;
  renderer.setRenderTarget(normalRT);
  renderer.clear();
  renderer.render(scene, camera);

  scene.overrideMaterial = depthMat;
  renderer.setRenderTarget(depthRT);
  renderer.setClearColor(0xffffff, 1);
  renderer.clear();
  renderer.render(scene, camera);

  scene.overrideMaterial = null;
  hidden.forEach((o, i) => o.visible = vis[i]);

  postMat.uniforms.tColor.value = colorRT.texture;
  postMat.uniforms.tNormal.value = normalRT.texture;
  postMat.uniforms.tDepth.value = depthRT.texture;
  renderer.setRenderTarget(null);
  renderer.setClearColor(0x000000, 0);
  renderer.clear();
  renderer.render(quadScene, quadCam);
}

/* 调试钩子（自动化截图 / 手动验收） */
window.__hl = {
  seek(seconds){ frozenShow = null; showStart = performance.now() - seconds * 1000; },
  freeze(seconds){ frozenShow = seconds; },
  resume(){ frozenShow = null; showStart = performance.now(); },
  setTier(i){ autoLoop = false; applyTier(i); },
  stats(){ return { tier: TIERS[tierIndex].key, score: Math.round(scoreShown), lidAngle: +lidL.rotation.z.toFixed(3) }; },
};

/* ------------------------------ 启动 ------------------------------ */
resize();
applyTier(0, { restart:false });
showStart = performance.now();
boot.classList.add('hide');
setTimeout(() => boot.remove(), 700);
tick();
</script>
